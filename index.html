<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0e5"><title>System Design · 技术书房</title><link rel="stylesheet" href="style.css?v=reader4"></head>
<body><div id="app">
<header class="topbar"><button id="back" class="icon-btn" aria-label="返回">‹</button><span id="topTitle">我的技术书房</span><button id="tocBtn" class="icon-btn" aria-label="打开目录">☷</button></header>
<main id="home" class="home"><div class="intro"><div class="hero-art"><span class="sun"></span><span class="mountain mountain-back"></span><span class="mountain mountain-front"></span><span class="hero-books">▰<br>▰<br>▰</span></div><span class="eyebrow">技术书房 · KNOWLEDGE LIBRARY</span><h1>系统设计与 SRE</h1><p>从架构设计到高可用实践的技术阅读笔记</p></div><div class="shelf-tabs"><span class="selected">我的书架</span><span>持续学习 · 循序渐进</span></div><div class="shelf-title"><h2>我的书架</h2><span id="bookCount"></span></div><div id="books" class="books"></div><p class="footnote">独立整理的通用技术笔记 · 不包含内部系统资料</p></main>
<main id="bookView" class="book-view" hidden><div id="bookCover" class="book-cover"></div><div class="book-progress"><span id="bookProgressText">阅读进度</span><div class="progress-track"><div id="bookProgressBar"></div></div></div><div class="book-heading"><h2>章节目录</h2><span id="chapterCount"></span></div><div id="chapters" class="chapters"></div><button id="continueReading" class="continue-reading" hidden>继续阅读 ›</button></main>
<main id="reader" class="reader" hidden><div class="reader-paper"><div class="reader-kicker" id="readerKicker"></div><h1 id="readerTitle"></h1><div id="readerBody" class="reader-body"></div><div class="reader-end">— 本节完 —</div></div></main>
<footer id="readerFooter" class="reader-footer" hidden><button id="prev" aria-label="上一页">‹ <span>上一页</span></button><div class="progress-wrap"><div class="progress-track"><div id="progressBar"></div></div><span id="pageInfo">1 / 1</span></div><button id="next" aria-label="下一页"><span>下一页</span> ›</button></footer>
<div id="overlay" class="overlay" hidden></div><aside id="drawer" class="drawer" aria-label="章节目录" aria-hidden="true"><div class="drawer-head"><strong>目录</strong><button id="closeDrawer" aria-label="关闭目录">×</button></div><div id="drawerContent"></div></aside>
</div><script src="app.js?v=reader3"></script></body></html>
