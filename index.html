<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0e5"><title>System Design · 技术书房</title><link rel="stylesheet" href="style.css?v=reader3"></head>
<body><div id="app">

<main id="home" class="home"><div class="intro"><span class="eyebrow">PERSONAL TECH LIBRARY</span><h1>把知识，读成一本书。</h1><p>System Design & SRE · 从基础到 Staff</p></div><div class="shelf-title"><h2>我的书架</h2><span id="bookCount"></span></div><div id="books" class="books"></div><p class="footnote">独立整理的通用技术笔记 · 不包含内部系统资料</p></main>
